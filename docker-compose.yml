# Local development environment: `docker compose up --build` starts both services.
services:
  db:
    # Postgres 18 (same major version as the hosted Neon database) with the pgvector
    # extension preinstalled. Pinned to an exact pgvector release so every machine and CI
    # run gets the same image.
    image: pgvector/pgvector:0.8.7-pg18
    # Injects POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB from .env.
    env_file: .env
    ports:
      # host:container. Bound to 127.0.0.1 so only the local machine (not the network) can
      # connect, e.g. with psql or a DB GUI.
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume: database files live outside the container, so data survives
      # `docker compose down` and restarts. (`down -v` deletes it.) Postgres 18 images keep
      # data in a version-named folder under /var/lib/postgresql (e.g. 18/docker), so the
      # volume is mounted one level up from the old .../data path; that also lets a future
      # major upgrade (pg_upgrade) see the old and new folders side by side.
      - pgdata:/var/lib/postgresql
      # Init scripts run only when the volume is first created (creates the test database).
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # "Healthy" = Postgres accepts connections. $$ escapes $ so the variable is expanded
      # inside the container, not by compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./api
      args:
        INSTALL_DEV: "true" # include pytest/ruff so `docker compose exec api pytest` works
    # Overrides the Dockerfile CMD for dev: first apply pending migrations, then start the
    # server. --reload restarts it when code changes; --reload-dir limits watching to app code
    # (not caches or a local .venv). `sh -c` is needed to chain two commands with &&.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Bind mount: the host's ./api folder appears at /app, so code edits are seen
      # instantly inside the container without rebuilding the image.
      - ./api:/app
    depends_on:
      db:
        # Wait until the db healthcheck passes, not just until the container has started.
        condition: service_healthy

volumes:
  pgdata:
