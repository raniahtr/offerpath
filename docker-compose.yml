# Local development environment: `docker compose up --build` starts both services.
services:
  db:
    # Postgres 16 with the pgvector extension preinstalled (for embedding search later).
    image: pgvector/pgvector:pg16
    # Injects POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB from .env.
    env_file: .env
    ports:
      # host:container. Bound to 127.0.0.1 so only your Mac (not your network) can connect,
      # e.g. with psql or a DB GUI.
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume: database files live outside the container, so data survives
      # `docker compose down` and restarts. (`down -v` deletes it.)
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "Healthy" = Postgres accepts connections. $$ escapes $ so the variable is expanded
      # inside the container, not by compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./api
      args:
        INSTALL_DEV: "true" # include pytest/ruff so `docker compose exec api pytest` works
    # Overrides the Dockerfile CMD for dev: --reload restarts the server when code changes;
    # --reload-dir limits watching to app code (not caches or your local .venv).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Bind mount: your ./api folder appears at /app, so edits on your Mac are seen
      # instantly inside the container without rebuilding the image.
      - ./api:/app
    depends_on:
      db:
        # Wait until the db healthcheck passes, not just until the container has started.
        condition: service_healthy

volumes:
  pgdata:
