# Continuous integration: lint + test the api on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A new push to the same branch/PR cancels the previous, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21" # same uv version as the Dockerfile
          enable-cache: true # reuse downloaded packages between runs
          cache-dependency-glob: api/uv.lock # invalidate the cache when the lockfile changes
      # Installs Python from api/.python-version and the exact deps from uv.lock (incl. dev group).
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  api-docker:
    name: API Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Fails the check if the production image no longer builds.
      - run: docker build ./api
