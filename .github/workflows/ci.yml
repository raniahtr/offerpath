# Continuous integration: lint + test the api on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A new push to the same branch/PR cancels the previous, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # Service container: GitHub starts this Postgres next to the job and waits for its
    # healthcheck before running the steps. Reachable at localhost:5432 from the job.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: offerpath
          POSTGRES_PASSWORD: offerpath # throwaway CI-only database, not a real secret
          POSTGRES_DB: offerpath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offerpath -d offerpath_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://offerpath:offerpath@localhost:5432/offerpath_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21" # same uv version as the Dockerfile
          enable-cache: true # reuse downloaded packages between runs
          cache-dependency-glob: api/uv.lock # invalidate the cache when the lockfile changes
      # Installs Python from api/.python-version and the exact deps from uv.lock (incl. dev group).
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Tests run the migrations themselves (down to base, then up to head) before testing.
      - run: uv run pytest

  api-docker:
    name: API Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Fails the check if the production image no longer builds.
      - run: docker build ./api
